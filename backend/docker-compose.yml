version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: smoodee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smoodee_local
      MYSQL_USER: smoodee
      MYSQL_PASSWORD: smoodee1234
    ports:
      - "3306:3306"
    volumes:
      - smoodee-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  smoodee-mysql-data:
