spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smoodee_local?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: smoodee
    password: smoodee1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-client-secret}
            scope:
              - openid
              - email

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-must-be-at-least-32-chars-long}
    access-token-expiry-ms: 900000       # 15분
    refresh-token-expiry-ms: 1209600000  # 14일
  storage:
    s3:
      bucket: ${S3_BUCKET:smoodee-dev}
      region: ${AWS_REGION:ap-northeast-2}
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
  render:
    output-prefix: renders
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
  oauth2:
    redirect-uri: "http://localhost:3000/oauth2/callback"
