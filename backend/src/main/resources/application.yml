spring:
  profiles:
    active: local
  application:
    name: smoodee
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul

server:
  port: 8080

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.smoodee: DEBUG
