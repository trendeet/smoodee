# /etc/nginx/conf.d/smoodee.conf
# 설치 방법: docs/infrastructure.md 참조
# certbot 실행 후 ssl 블록이 자동으로 추가됩니다

server {
    listen 80;
    server_name smoodee.p-e.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name smoodee.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/smoodee.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smoodee.p-e.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55M;

    # Spring Boot API
    location /api/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # OAuth2 로그인 시작 → 백엔드
    location /oauth2/authorization/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # OAuth2 콜백 → 백엔드 (Google: /login/oauth2/code/google, Kakao: /login/oauth2/code/kakao)
    location /login/oauth2/ {
        proxy_pass         http://localhost:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 나머지 모든 경로 → 프론트엔드 (Next.js)
    # /oauth2/callback, /login/, / 등 포함
    location / {
        proxy_pass         http://localhost:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
